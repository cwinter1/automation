{% extends "base.html" %}
{% block title %}Review{% endblock %}
{% block content %}
<div class="review-wrap">
  <h2>Your rows</h2>
  <p class="hint">
    Locked cells are read-only. Editable cells save automatically as you change them — the
    Save button is there for a manual confirmation, not required.
  </p>
  <input type="search" id="grid-search" class="search-box" placeholder="Search your rows…">
  <div id="grid-wrap"></div>
  <button id="save-btn" type="button">Save</button>
  <p id="save-status" class="status"></p>
</div>
{% endblock %}
